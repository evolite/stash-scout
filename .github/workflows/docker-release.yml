name: Docker release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git-cliff needs the tag history

      # Bake this release's notes (feat/fix only, see cliff.toml) into the image;
      # the app shows them under Settings > Version & changelog.
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} -o CHANGELOG.md

      # QEMU-emulated arm64 builds crash mid-npm-install ("qemu: uncaught
      # target signal 4 (Illegal instruction)") on Node 22 with the default
      # tonistiigi/binfmt build the runner installs, and also with its
      # `latest` tag — pinning to this known-good qemu build is the
      # documented workaround.
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Keeps the committed CHANGELOG.md current. Notes are generated from the tag
  # (not from main's tip, which may have moved on) and committed back to main.
  # Tag-triggered only, so the push can't retrigger this workflow.
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} -o ${{ runner.temp }}/CHANGELOG.md

      - name: Commit changelog to main
        run: |
          git fetch origin main
          git checkout -f -B main origin/main
          cp "${{ runner.temp }}/CHANGELOG.md" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): update changelog for ${{ github.ref_name }}"
          git push origin HEAD:main
