# Runs a SonarQube analysis of main on every push (this replaced the Forgejo
# sonar workflow, so there is a single scanner). Community Edition: no PR
# analysis or Code Scanning publishing, hence no pull_request trigger.
# Project key and sources come from sonar-project.properties.
#
# Repo secrets required (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN     token from SonarQube (My account > Security)
#   SONAR_HOST_URL  e.g. https://sonar.slashdir.net
# Until both exist the scan step is skipped, so the workflow stays green.
name: SonarQube analysis

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for accurate new-code / blame data

      # The gate's "new code" period is "previous version", so Sonar needs the
      # project version on every analysis to know where a release starts.
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Analyze with SonarQube
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: -Dsonar.projectVersion=${{ steps.ver.outputs.version }}
