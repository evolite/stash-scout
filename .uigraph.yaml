version: 1

service:
  name: Stash Scout
  category: Web App
  description: Browse StashDB with saved filters, subscriptions and global tag excludes, then add scenes to Whisparr and track them into local Stash.
  repository:
    provider: github
    url: https://github.com/evolite/stash-scout
  ownership:
    team: evolite
  labels:
    - typescript
    - express
    - sqlite

apis:
  - name: stash-scout-api
    type: openapi
    path: .uigraph/openapi/stash-scout-api.yaml

dependencies:
  - name: stashdb-graphql
    service: StashDB
    direction: downstream
    criticality: hard
    type: graphql
    description: Scene, performer, studio and tag queries.
  - name: local-stash-graphql
    service: Local Stash
    direction: downstream
    criticality: soft
    type: graphql
    description: Looks up whether a StashDB scene is already in the library.
  - name: whisparr-api
    service: Whisparr
    direction: downstream
    criticality: soft
    type: http
    description: Adds scenes, toggles monitoring, reads movie list and download queue.
  - name: oidc-provider
    service: OIDC Provider
    direction: downstream
    criticality: soft
    type: http
    description: Optional SSO login (authMode oidc).
  - name: github-tags
    service: GitHub API
    direction: downstream
    criticality: soft
    type: http
    description: Update check against repository tags.

architectureDiagrams:
  - name: System Context
    path: .uigraph/diagrams/system-context/system-context.mmd
    contextPath: .uigraph/diagrams/system-context/context.json
  - name: User Journey
    path: .uigraph/diagrams/user-journey/user-journey.mmd
  - name: Add Scene to Whisparr
    path: .uigraph/diagrams/add-scene-to-whisparr/add-scene-to-whisparr.mmd
  - name: Release Pipeline
    path: .uigraph/diagrams/release-pipeline/release-pipeline.mmd

databases:
  - name: app
    dialect: sqlite
    dbType: SQLite
    schemaPath: .uigraph/db/stash-scout.sql

docs:
  - name: README
    path: README.md
    fileType: markdown
    description: What Stash Scout is, how to run it, login options.

maps:
  - name: Stash Scout UI
    description: Main tabs, with the API operations and diagrams behind them. Screenshots taken with SFW Mode on.
    frames:
      - name: Feed
        description: Charts and the merged feed of new releases.
        imagePath: .uigraph/maps/feed.png
        focalPoints:
          - name: Scene card
            x: 403.84615384615387
            y: 694.7843911764505
            components:
              - componentId: component_api-contract
                serviceName: Stash Scout
                apiGroupName: stash-scout-api
                operationId: getSceneStatuses
              - componentId: component_api-contract
                serviceName: Stash Scout
                apiGroupName: stash-scout-api
                operationId: addSceneToWhisparr
              - componentId: component_api-contract
                serviceName: Stash Scout
                apiGroupName: stash-scout-api
                operationId: ignoreScene
              - componentId: component_backend-flow-diagram
                serviceName: Stash Scout
                architectureDiagramName: Add Scene to Whisparr
          - name: Feed source chips
            x: 487.76223776223776
            y: 63.665510057569385
            components:
              - componentId: component_api-contract
